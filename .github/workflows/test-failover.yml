name: Test Runner Failover

on:
  workflow_dispatch:

jobs:
  pick-runner:
    uses: bytesphere-org/ci-templates/.github/workflows/pick-runner.yml@main
    with:
      org: bytesphere-org
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  run-on-picked:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels_json) }}
    steps:
      - run: |
          echo "picked labels: ${{ needs.pick-runner.outputs.labels_json }}"
          hostname
          uname -a
